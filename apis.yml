aid: latitud
name: Latitud
description: 'Latitud is an early-stage venture capital firm and founder platform that
  writes first checks for Latin American founders, positioning itself as a bridge between
  the LatAm startup ecosystem and Silicon Valley. Its flagship program is the Latitud
  Fellowship, an eight-week remote program for pre-founders, dealmakers and technical
  builders that ends with a week-long roadshow in San Francisco, and which invests a
  $62,500 ideation check on a SAFE for a 2.5 percent stake in a cohort of eight fellows.
  Latitud also runs a portfolio support practice, a mentor network drawn from companies
  such as Mercado Libre, Vercel, Auth0 and Cornershop, and a Spanish- and Portuguese-language
  media surface including a podcast and community channels. Latitud publishes no public
  API, developer portal, SDKs or machine-readable specifications; its public surface is
  a three-page marketing site (home, fellowship, portfolio) plus an application form, so
  this profile is an identity and web-properties record rather than an API profile.'
